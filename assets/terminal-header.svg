<svg width="100%" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .term-bg { fill: #0d1117; }
      .term-border { fill: none; stroke: #30363d; stroke-width: 1.5; }
      .chrome { fill: #161b22; }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      .title-text { fill: #8b949e; font-family: 'Courier New', monospace; font-size: 13px; }
      .user { fill: #00ff9c; font-family: 'Courier New', monospace; font-size: 16px; font-weight: bold; }
      .prompt { fill: #58a6ff; font-family: 'Courier New', monospace; font-size: 16px; }
      .cmd { fill: #e6edf3; font-family: 'Courier New', monospace; font-size: 16px; }
      .output { fill: #00ff9c; font-family: 'Courier New', monospace; font-size: 16px; }
      .cursor { fill: #00ff9c; animation: blink 1s step-start infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect class="term-bg" x="1" y="1" width="798" height="318" rx="10"/>
  <rect class="term-border" x="1" y="1" width="798" height="318" rx="10"/>
  <rect class="chrome" x="1" y="1" width="798" height="36" rx="10"/>
  <rect class="chrome" x="1" y="20" width="798" height="17"/>

  <circle class="dot-red" cx="24" cy="19" r="6"/>
  <circle class="dot-yellow" cx="44" cy="19" r="6"/>
  <circle class="dot-green" cx="64" cy="19" r="6"/>

  <text x="400" y="24" text-anchor="middle" class="title-text">chefferson@github: ~</text>

  <text x="24" y="70"><tspan class="user">chefferson@github</tspan><tspan class="prompt">:~$</tspan><tspan class="cmd"> whoami</tspan></text>
  <text x="24" y="100" class="output">&gt; full-stack developer — software, games, automation, ai</text>

  <text x="24" y="140"><tspan class="user">chefferson@github</tspan><tspan class="prompt">:~$</tspan><tspan class="cmd"> cat status.txt</tspan></text>
  <text x="24" y="170" class="output">&gt; open to work</text>

  <text x="24" y="210"><tspan class="user">chefferson@github</tspan><tspan class="prompt">:~$</tspan><tspan class="cmd"> echo "$MOTTO"</tspan></text>
  <text x="24" y="240" class="output">&gt; make it simple. make it fast. ship it.</text>

  <text x="24" y="280"><tspan class="user">chefferson@github</tspan><tspan class="prompt">:~$</tspan></text>
  <rect class="cursor" x="216" y="266" width="10" height="18"/>
</svg>
